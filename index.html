<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Bhasad — So many questions. One hell of a confusion. Watch the pilot video.">
  <meta name="theme-color" content="#080808">
  <link rel="canonical" href="https://bhasad.org">
  <title>Bhasad | Think About It. Seriously.</title>
  <style>
    :root { color-scheme: dark; --bg:#080808; --surface:#121212; --text:#f5f2eb; --muted:#9d9a92; --accent:#ff3b00; --gold:#ffd000; --border:rgba(255,255,255,.12); }
    * { box-sizing:border-box; }
    html { min-height:100%; background:var(--bg); scroll-behavior:smooth; }
    body { min-height:100svh; margin:0; color:var(--text); background:radial-gradient(circle at 50% 15%,rgba(255,59,0,.18),transparent 32rem),var(--bg); font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    main { width:min(100% - 2rem,760px); min-height:100svh; margin:0 auto; padding:max(2rem,env(safe-area-inset-top)) 0 max(2rem,env(safe-area-inset-bottom)); display:grid; align-content:center; justify-items:center; gap:1.4rem; text-align:center; }
    .brand { margin:0; font-size:clamp(3.8rem,17vw,8rem); line-height:.84; letter-spacing:.04em; text-transform:uppercase; font-weight:950; }
    .brand span { color:var(--accent); }
    .tagline { max-width:34rem; margin:0; color:var(--gold); font-size:clamp(1.15rem,4.6vw,1.7rem); line-height:1.25; font-weight:800; text-wrap:balance; }
    .video-shell { width:min(100%,390px); overflow:hidden; border:1px solid var(--border); border-radius:1.5rem; background:var(--surface); box-shadow:0 2rem 5rem rgba(0,0,0,.45); }
    .video-frame { position:relative; width:100%; aspect-ratio:9/16; background:#000; }
    .video-frame iframe { position:absolute; inset:0; width:100%; height:100%; border:0; }
    .links { display:grid; justify-items:center; gap:1rem; }
    .watch-link { display:inline-flex; min-height:48px; align-items:center; justify-content:center; padding:.75rem 1.2rem; border-radius:999px; color:#fff; background:var(--accent); font-weight:800; text-decoration:none; transition:transform 160ms ease,filter 160ms ease; }
    .watch-link:hover,.watch-link:focus-visible { filter:brightness(1.12); transform:translateY(-1px); }
    .signoff { margin:0; color:var(--muted); font-size:.95rem; letter-spacing:.08em; text-transform:uppercase; }
    .domain { color:var(--text); text-decoration:none; font-weight:800; }
    @media (max-height:780px) and (min-width:700px) {
      main { width:min(100% - 3rem,1040px); grid-template-columns:minmax(260px,1fr) minmax(260px,390px); grid-template-areas:"copy video" "links video"; column-gap:3rem; text-align:left; }
      .copy { grid-area:copy; }
      .video-shell { grid-area:video; }
      .links { grid-area:links; justify-self:start; justify-items:start; }
    }
  </style>
</head>
<body>
  <main>
    <section class="copy" aria-labelledby="page-title">
      <h1 class="brand" id="page-title">Bha<span>sad</span></h1>
      <p class="tagline">So many questions. One hell of a confusion.</p>
    </section>
    <section class="video-shell" aria-label="Bhasad pilot video">
      <div class="video-frame">
        <iframe src="https://www.youtube-nocookie.com/embed/kyGOdtI19vs?rel=0" title="Bhasad pilot YouTube Short" loading="eager" referrerpolicy="strict-origin-when-cross-origin" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
      </div>
    </section>
    <section class="links">
      <a class="watch-link" href="https://youtube.com/shorts/kyGOdtI19vs" target="_blank" rel="noopener noreferrer">Watch on YouTube</a>
      <p class="signoff">Think about it. Seriously. · <a class="domain" href="https://bhasad.org">bhasad.org</a></p>
    </section>
  </main>
</body>
</html>
